namespace: monitoring

resources:
- pvc.yaml
- externalgrafana.yaml

helmCharts:
- name: grafana
  namespace: monitoring
  releaseName: '{{ app_name }}'
  repo: oci://ghcr.io/grafana-community/helm-charts/
  valuesFile: values.yaml
  version: 12.7.2

secretGenerator:
- literals:
  - GF_SMTP_USER="{{ grafana.smtp_credentials.user }}"
  - GF_SMTP_PASSWORD="{{ grafana.smtp_credentials.password }}"
  - GRAFANA_CLIENT_SECRET="{{ grafana_oidc_client_secret }}"
  - GF_SECURITY_ADMIN_USER="{{ grafana.admin.user }}"
  - GF_SECURITY_ADMIN_PASSWORD="{{ grafana.admin.password }}"
  name: grafana-credentials
  options:
    disableNameSuffixHash: true
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/instance: '{{ app_name }}'
