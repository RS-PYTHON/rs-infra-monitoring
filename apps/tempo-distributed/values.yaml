ingester:
  affinity: |
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: "node-role.kubernetes.io/infra"
              operator: Exists

distributor:
  affinity: |
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: "node-role.kubernetes.io/infra"
              operator: Exists

compactor:
  config:
    compaction:
      block_retention: 2160h #2160 hours in 90 days
  affinity: |
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: "node-role.kubernetes.io/infra"
              operator: Exists

querier:
  affinity: |
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: "node-role.kubernetes.io/infra"
              operator: Exists

queryFrontend:
  query:
    enabled: true
  affinity: |
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: "node-role.kubernetes.io/infra"
              operator: Exists

traces:
  otlp:
    http:
      enabled: true
    grpc:
      enabled: true

server:
  grpc_server_max_recv_msg_size: 41943040
  grpc_server_max_send_msg_size: 41943040

storage:
  trace:
    backend: s3
    s3:
      access_key: {{ s3.access_key }}
      secret_key: {{ s3.secret_key }}
      bucket: {{ grafanatempo.s3.bucket }}
      endpoint: {{ s3.endpoint | regex_replace('http(.)?://', '') }}
      region: {{ s3.region }}
      insecure: false

global_overrides:
  max_bytes_per_trace: 50000000

memcached:
  affinity: |
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: "node-role.kubernetes.io/infra"
              operator: Exists

metaMonitoring:
  serviceMonitor:
    enabled: true
    interval: {{ grafanatempo.metaMonitoring.serviceMonitor.interval}}
    scrapeTimeout: {{ grafanatempo.metaMonitoring.serviceMonitor.scrapeTimeout }}
