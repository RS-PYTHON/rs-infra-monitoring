alertmanager:
  alertmanagerSpec:
    resources:
      limits:
        memory: 32Mi
      requests:
        memory: 16Mi

grafana:
  enabled: false

prometheusOperator:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: "node-role.kubernetes.io/infra"
              operator: Exists
  resources:
    limits:
      memory: 64Mi
    requests:
      memory: 27Mi

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

prometheus:
  ingress:
    enabled: false
    # For Kubernetes >= 1.18 you should specify the ingress-controller via the field ingressClassName
    # See https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#specifying-the-class-of-an-ingress
    ingressClassName: nginx

    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
      nginx.ingress.kubernetes.io/proxy-buffer-size: 32k
      nginx.ingress.kubernetes.io/auth-signin: https://oauth2-proxy.{{ platform_domain_name }}/oauth2/start?rd=https://$host/prometheus
      nginx.ingress.kubernetes.io/auth-url: https://oauth2-proxy.{{ platform_domain_name }}/oauth2/auth
      nginx.ingress.kubernetes.io/auth-response-headers: Authorization

    labels: {}

    ## Redirect ingress to an additional defined port on the service
    # servicePort: 8081

    ## Hostnames.
    ## Must be provided if Ingress is enabled.
    ##
    # hosts:
    #   - prometheus.domain.com
    hosts:
      - monitoring.{{ platform_domain_name }}

    ## Paths to use for ingress rules - one path should match the prometheusSpec.routePrefix
    ##
    paths:
      - /prometheus

    ## For Kubernetes >= 1.18 you should specify the pathType (determines how Ingress paths should be matched)
    ## See https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#better-path-matching-with-path-types
    pathType: Prefix

    ## TLS configuration for Prometheus Ingress
    ## Secret must be manually created in the namespace
    ##
    tls:
      - secretName: monitoring-{{ platform_domain_name | replace(".", "-") }}
        hosts:
          - monitoring.{{ platform_domain_name }}
  route:
    main:
      enabled: true
      hostnames:
      - monitoring.{{ platform_domain_name }}
      parentRefs:
      - name: monitoring
        kind: ListenerSet
        namespace: monitoring
      matches:
      - path:
          type: PathPrefix
          value: /prometheus
      - path:
          type: PathPrefix
          value: /oauth2

  prometheusSpec:
    ## External URL at which Prometheus will be reachable.
    ##
    externalUrl: "http://prometheus-operated.monitoring.svc.cluster.local/prometheus"

    ## How long to retain metrics
    ##
    retention: 30d

    routePrefix: /prometheus

    ## If true, a nil or {} value for prometheus.prometheusSpec.podMonitorSelector will cause the
    ## prometheus resource to be created with selectors based on values in the helm deployment,
    ## which will also match the podmonitors created
    ##
    podMonitorSelectorNilUsesHelmValues: false

    ## If true, a nil or {} value for prometheus.prometheusSpec.serviceMonitorSelector will cause the
    ## prometheus resource to be created with selectors based on values in the helm deployment,
    ## which will also match the servicemonitors created
    ##
    serviceMonitorSelectorNilUsesHelmValues: false

    storageSpec:
    ## Using PersistentVolumeClaim
    ##
      volumeClaimTemplate:
        spec:
          storageClassName: csi-cinder-high-speed-retain
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
              - key: "node-role.kubernetes.io/infra"
                operator: Exists

    ## Resource limits & requests
    ##
    resources:
      requests:
        memory: 512Mi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: 1000m

    additionalScrapeConfigs:
      - job_name: prometheus
        scrape_interval: 10s
        static_configs:
          - targets: ["localhost:9090"]
        metrics_path: /prometheus/metrics
      - job_name: nv-exporter
        scrape_interval: 30s
        static_configs:
            - targets: ["neuvector-prometheus-exporter.security.svc.cluster.local:8068"]

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false
